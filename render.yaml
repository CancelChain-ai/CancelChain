# Render Blueprint: the API and the indexer as one free web service (T044, T046).
#
# Render's free instance is a web service only — a background worker is paid —
# so the indexer runs inside the API process (RUN_INDEXER=true) instead of as a
# second service. The instance spins down after 15 minutes without an inbound
# request; an external monitor (UptimeRobot, the owner's account) sends
# HEAD /health every 5 minutes, and the 750 free instance hours a month cover
# one service around the clock. A schedule in GitHub Actions does not do this:
# GitHub thins out frequent schedules to one run in hours. If the service does
# sleep, the indexer stops with it and catches up from its cursor on waking.
#
# The schema comes with the code: MIGRATE_ON_START applies every pending
# migration at start, before the indexer and before the port opens. The free
# plan has no pre-deploy command and no shell to do it otherwise.
#
# Values with `sync: false` are entered in the Render dashboard, never here.
# The page on GitHub Pages reaches this service through the repository
# variable API_URL (.github/workflows/pages.yml).
#
# Owner, once: Render → New → Blueprint → this repository → fill in the
# `sync: false` values. Every push to main then redeploys the service.
services:
  - type: web
    name: cancelchain-api
    runtime: node
    plan: free
    # The Render region closest to the Supabase project (eu-west-1, Ireland;
    # Render has no Irish region): every request the API answers from the
    # cache crosses this distance at least once.
    region: frankfurt
    # Not `corepack enable`: the Node 26 image keeps its own pnpm in a read-only
    # /usr/bin, `enable` fails replacing it, and Node 25+ no longer ships
    # corepack. npx runs the exact version from package.json → packageManager.
    # Dev dependencies are installed too (no NODE_ENV=production here): the API
    # runs its TypeScript through tsx and has no build step.
    buildCommand: npx -y pnpm@9.15.0 install --frozen-lockfile
    # tsx rather than plain `node`: the sources import each other as `.js`, and
    # Node's type stripping does not map those to the `.ts` files.
    startCommand: cd apps/api && ./node_modules/.bin/tsx src/index.ts
    healthCheckPath: /health
    envVars:
      # The version everything is developed and tested on locally.
      - key: NODE_VERSION
        value: "26"
      - key: LOG_LEVEL
        value: info

      # ── What runs in this process ─────────────────────────────────────────
      - key: RUN_INDEXER
        value: "true"
      - key: MIGRATE_ON_START
        value: "true"
      # true — the log subscription with its 15-second watchdog; false — the
      # polling fallback over wallets with an open page (T045).
      - key: INDEXER_USE_WS
        value: "true"
      - key: EVENTS_RETENTION_DAYS
        value: "90"

      # ── Network ────────────────────────────────────────────────────────────
      - key: SOLANA_CLUSTER
        value: devnet
      # Helius devnet with the owner's key. Server side only — never in VITE_*.
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_WS_URL
        sync: false
      # devnet USDC (FR-020) — a public address, not a secret.
      - key: USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU

      # ── Database (Supabase) ────────────────────────────────────────────────
      # Transaction pooler, port 6543: every query of the API and the indexer.
      - key: DATABASE_URL
        sync: false
      # Session pooler, port 5432, same host and user: LISTEN for the live
      # stream, and the migrations at start. Not the direct db.<ref> host —
      # that one is IPv6-only and does not resolve from here.
      - key: DATABASE_LISTEN_URL
        sync: false

      # ── The page on GitHub Pages ───────────────────────────────────────────
      # Origin only — scheme and host, no path, no trailing slash.
      - key: CORS_ORIGINS
        value: https://cancelchain-ai.github.io
      # The host the wallet shows when a merchant signs in: the page's, not this API's.
      - key: AUTH_DOMAIN
        value: cancelchain-ai.github.io
      # Signs merchant tokens. Generated by Render once and kept; nobody types it.
      - key: JWT_SECRET
        generateValue: true

      # ── Web Push (T043) — all three or none; none is push off ──────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_UPCOMING_LEAD_HOURS
        value: "24"
