packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  # Прогони на справжній мережі (T028, T047, T051…): свій пакет, бо в них інші
  # залежності й інші таймаути, ніж у модульних тестів застосунків.
  - "tests"

# Трійка версій Solana пиняться в одному місці й точно, без `^`.
#
# `@solana/subscriptions@0.5.0` — SDK чужої програми — має peer `@solana/kit ^7.0.0`.
# Підйом kit до 8 ламає його на етапі резолву, мовчки: peer лишається невдоволеним,
# а помилка виникає далеко нижче за течією, у рантаймі кодеків. Каталог робить так,
# що версія в усіх пакетах монорепо буквально одна, а не «сумісна».
#
# Фактичну резолюцію сторожить тест `packages/chain/src/versions.test.ts` — він читає
# встановлені `package.json`, тож дрейф падає в `pnpm gate`, а не на devnet.
catalog:
  "@solana/kit": 7.1.1
  "@solana/react": 7.1.1
  "@solana/subscriptions": 0.5.0
